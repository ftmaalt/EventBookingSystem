spring.config.import=optional:file:./.env[.properties]
spring.application.name=auth-service
server.port=8081
# trust X-Forwarded-For from the nginx gateway so login rate limiting sees the real client IP
server.forward-headers-strategy=native

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bookngo}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.schemas=auth
spring.flyway.default-schema=auth
spring.jpa.properties.hibernate.default_schema=auth

spring.flyway.locations=classpath:db/migration

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.internal-api-key=${INTERNAL_API_KEY:}
app.seed.enabled=${SEED_ENABLED:false}
app.seed.password=${SEED_PASSWORD:}

# Kafka producer: auth-service publishes AccountEvent messages to account-events
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.spring.json.add.type.headers=false
app.kafka.topics.account-events=${KAFKA_TOPIC_ACCOUNT_EVENTS:account-events}
app.kafka.partitions=${KAFKA_TOPIC_PARTITIONS:3}
app.kafka.replication-factor=${KAFKA_REPLICATION_FACTOR:1}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.mail.enabled=false

# File Storage
file.upload-dir=${FILE_UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

