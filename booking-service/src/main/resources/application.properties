spring.config.import=optional:file:./.env[.properties]
spring.application.name=booking-service
server.port=8083

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bookngo}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=booking

spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=booking
spring.flyway.default-schema=booking

app.jwt.secret=${JWT_SECRET}
services.catalog.url=${CATALOG_SERVICE_URL:http://localhost:8082}

# Kafka producer: booking-service publishes BookingEvent messages to booking-events
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
# wait for all in-sync replicas, and let the broker drop duplicates caused by producer retries
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# plain JSON with no Java class name headers: consumers must not depend on booking-service classes
spring.kafka.producer.properties.spring.json.add.type.headers=false
app.kafka.topics.booking-events=${KAFKA_TOPIC_BOOKING_EVENTS:booking-events}
app.kafka.partitions=${KAFKA_TOPIC_PARTITIONS:3}
app.kafka.replication-factor=${KAFKA_REPLICATION_FACTOR:1}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
