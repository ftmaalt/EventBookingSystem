name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # a throw-away Postgres for the tests (the Spring context tests need a database)
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_DB: bookngo
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # values for CI only, not real secrets
    env:
      DB_URL: jdbc:postgresql://localhost:5432/bookngo
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: dGVzdC1qd3Qtc2VjcmV0LWZvci1jaS1vbmx5LTAxMjM0NTY3ODk=
      INTERNAL_API_KEY: ci-internal-key
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build and test all services
        run: mvn -B verify

  docker:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - service: auth-service
            port: "8081"
          - service: catalog-service
            port: "8082"
          - service: booking-service
            port: "8083"
          - service: notification-service
            port: "8084"
          - service: compliance-service
            port: "8085"

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            SERVICE=${{ matrix.service }}
            PORT=${{ matrix.port }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bookngo-${{ matrix.service }}:1.0.${{ github.run_number }}
            ${{ secrets.DOCKERHUB_USERNAME }}/bookngo-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max