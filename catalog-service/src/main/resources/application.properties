spring.config.import=optional:file:./.env[.properties]
spring.application.name=catalog-service
server.port=8082

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bookngo}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=catalog

spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=catalog
spring.flyway.default-schema=catalog

app.jwt.secret=${JWT_SECRET}
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}

app.cache.specs.categories.ttl=${CACHE_CATEGORIES_TTL_SECONDS:${CACHE_TTL_SECONDS:300}}s
app.cache.specs.categories.max-size=${CACHE_CATEGORIES_MAX_SIZE:${CACHE_MAX_SIZE:500}}
app.cache.specs.categoryById.ttl=${CACHE_CATEGORY_BY_ID_TTL_SECONDS:${CACHE_TTL_SECONDS:300}}s
app.cache.specs.categoryById.max-size=${CACHE_CATEGORY_BY_ID_MAX_SIZE:${CACHE_MAX_SIZE:500}}
app.cache.specs.activityById.ttl=${CACHE_ACTIVITY_BY_ID_TTL_SECONDS:${CACHE_TTL_SECONDS:300}}s
app.cache.specs.activityById.max-size=${CACHE_ACTIVITY_BY_ID_MAX_SIZE:${CACHE_MAX_SIZE:500}}
app.cache.specs.locations.ttl=${CACHE_LOCATIONS_TTL_SECONDS:${CACHE_TTL_SECONDS:300}}s
app.cache.specs.locations.max-size=${CACHE_LOCATIONS_MAX_SIZE:${CACHE_MAX_SIZE:500}}
app.cache.specs.locationById.ttl=${CACHE_LOCATION_BY_ID_TTL_SECONDS:${CACHE_TTL_SECONDS:300}}s
app.cache.specs.locationById.max-size=${CACHE_LOCATION_BY_ID_MAX_SIZE:${CACHE_MAX_SIZE:500}}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
