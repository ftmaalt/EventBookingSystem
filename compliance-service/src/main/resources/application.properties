spring.config.import=optional:file:./.env[.properties]
spring.application.name=compliance-service
server.port=8085

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bookngo}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=compliance

spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=compliance
spring.flyway.default-schema=compliance

app.jwt.secret=${JWT_SECRET}
# shared secret sent as X-Internal-Key when calling the internal endpoints of auth-service and booking-service
app.internal-api-key=${INTERNAL_API_KEY:}
app.penalty.fee=10.000

services.auth.url=${AUTH_SERVICE_URL:http://localhost:8081}
services.booking.url=${BOOKING_SERVICE_URL:http://localhost:8083}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
