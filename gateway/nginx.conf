events {}

http {
    client_max_body_size 5m;   # profile pictures are up to 5 MB

    # defaults for every proxied request
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    server {
        listen 8080;
        # also IPv6: inside the Alpine container "localhost" resolves to ::1 (used by the healthcheck)
        listen [::]:8080;

        location = /health { return 200 "ok"; }

        # auth-service
        location /api/auth             { proxy_pass http://auth-service:8081; }
        location /api/users            { proxy_pass http://auth-service:8081; }
        location /api/admin            { proxy_pass http://auth-service:8081; }
        location /api/applications     { proxy_pass http://auth-service:8081; }
        location /api/provider-profile { proxy_pass http://auth-service:8081; }
        location /uploads              { proxy_pass http://auth-service:8081; }

        # catalog-service
        location /api/activities       { proxy_pass http://catalog-service:8082; }
        location /api/categories       { proxy_pass http://catalog-service:8082; }
        location /api/locations        { proxy_pass http://catalog-service:8082; }

        # booking-service
        location /api/sessions         { proxy_pass http://booking-service:8083; }
        location /api/bookings         { proxy_pass http://booking-service:8083; }
        location /api/waitlist         { proxy_pass http://booking-service:8083; }

        # notification-service (live SSE stream: buffering must be off)
        location /api/notifications {
            proxy_pass http://notification-service:8084;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }

        # compliance-service
        location /api/violations       { proxy_pass http://compliance-service:8085; }
        location /api/penalties        { proxy_pass http://compliance-service:8085; }
    }
}