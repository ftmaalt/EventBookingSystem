name: bookngo

x-logging: &default-logging
  driver: awslogs
  options:
    awslogs-region: ${AWS_REGION:-us-east-1}
    awslogs-group: ${CW_LOG_GROUP:-bookngo}
    awslogs-create-group: "true"
    tag: "{{.Name}}"

x-service-env: &service-env
  DB_URL: jdbc:postgresql://${RDS_HOST:?set RDS_HOST in .env}:5432/bookngo?sslmode=require
  DB_USERNAME: ${DB_USERNAME:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  JAVA_TOOL_OPTIONS: -Xmx400m

x-service-depends: &service-depends
  kafka:
    condition: service_healthy

services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  auth-service:
    image: ftmam/bookngo-auth-service:${IMAGE_TAG:-latest}
    environment:
      <<: *service-env
      FILE_UPLOAD_DIR: /app/uploads
      SEED_ENABLED: ${SEED_ENABLED:-false}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    volumes:
      - auth-uploads:/app/uploads
    depends_on: *service-depends
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    logging: *default-logging

  catalog-service:
    image: ftmam/bookngo-catalog-service:${IMAGE_TAG:-latest}
    environment:
      <<: *service-env
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    depends_on: *service-depends
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    logging: *default-logging

  booking-service:
    image: ftmam/bookngo-booking-service:${IMAGE_TAG:-latest}
    environment:
      <<: *service-env
      CATALOG_SERVICE_URL: http://catalog-service:8082
    depends_on:
      <<: *service-depends
      catalog-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    logging: *default-logging

  notification-service:
    image: ftmam/bookngo-notification-service:${IMAGE_TAG:-latest}
    environment:
      <<: *service-env
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    depends_on: *service-depends
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    logging: *default-logging

  compliance-service:
    image: ftmam/bookngo-compliance-service:${IMAGE_TAG:-latest}
    environment:
      <<: *service-env
      AUTH_SERVICE_URL: http://auth-service:8081
      BOOKING_SERVICE_URL: http://booking-service:8083
    depends_on:
      <<: *service-depends
      auth-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    logging: *default-logging

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      compliance-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

volumes:
  kafka-data:
  auth-uploads: