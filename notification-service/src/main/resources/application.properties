spring.config.import=optional:file:./.env[.properties]
spring.application.name=notification-service
server.port=8084

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bookngo}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=notification

spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=notification
spring.flyway.default-schema=notification

app.jwt.secret=${JWT_SECRET}
app.internal-api-key=${INTERNAL_API_KEY:}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# E-mail (off by default: messages are logged instead of sent)
app.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Kafka consumer: notification-service consumes booking-events and account-events
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# all instances share one group, so each event is handled by exactly one instance
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:notification-service}
# a brand-new group starts from the oldest retained event instead of skipping what it missed
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# ErrorHandlingDeserializer turns bad JSON into an error the DLT handler can deal with (no endless poison-pill loop)
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.trusted.packages=com.bookngo.notificationservice.kafka
# back-pressure: fetch at most 50 records per poll; 3 listener threads (one per partition)
spring.kafka.consumer.max-poll-records=50
spring.kafka.listener.concurrency=${KAFKA_LISTENER_CONCURRENCY:3}
app.kafka.topics.booking-events=${KAFKA_TOPIC_BOOKING_EVENTS:booking-events}
app.kafka.topics.account-events=${KAFKA_TOPIC_ACCOUNT_EVENTS:account-events}
app.kafka.partitions=${KAFKA_TOPIC_PARTITIONS:3}
app.kafka.replication-factor=${KAFKA_REPLICATION_FACTOR:1}
app.kafka.retry.attempts=3

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
